<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>setting</title>
</head>

<body>
    <div class="container">
        <h1>Setting</h1>
    <div class="spinner" id="spinner"></div>
    
        <div class="w-50 p-3 hidden">
            <div class="input-group mb-3">
                <span class="input-group-text" id="dl_inpt_span">download path</span>
                <input type="text" class="form-control" placeholder="download path" aria-label="Username"
                    aria-describedby="dl_inpt_span" id="download_path">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text" id="port_inpt_span">port</span>
                <input type="text" class="form-control" placeholder="Port Number" aria-label="Username"
                    aria-describedby="port_inpt_span" id="port">
            </div>
        </div>
        <button type="button" onclick="save_settings()" class="btn btn-primary">Save</button>
    </div>
    <script src="js/server_info.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
